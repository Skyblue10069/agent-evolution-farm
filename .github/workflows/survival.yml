name: Agent Evolution - Autonomous Agent Farm

on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-evolution-farm
  cancel-in-progress: false

jobs:
  farm-run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      MTN_CLIENT_ID: ${{ secrets.MTN_CLIENT_ID }}
      MTN_CLIENT_SECRET: ${{ secrets.MTN_CLIENT_SECRET }}
      MTN_ENV: ${{ vars.MTN_ENV || 'sandbox' }}
      MTN_LIVE_PAYOUT_ENABLED: ${{ vars.MTN_LIVE_PAYOUT_ENABLED || 'false' }}
      MTN_TOKEN_URL: ${{ vars.MTN_TOKEN_URL }}
      MTN_WITHDRAWALS_URL: ${{ vars.MTN_WITHDRAWALS_URL }}
      PAYOUT_DESTINATION_ID: ${{ secrets.PAYOUT_DESTINATION_ID }}
      PAYOUT_MOBILE_MONEY_NETWORK: ${{ secrets.PAYOUT_MOBILE_MONEY_NETWORK }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight integrity and security checks
        run: python integrity_check.py

      - name: Run autonomous farm cycle
        run: python farm_orchestrator.py

      - name: Clean Python caches
        if: always()
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Show generated state
        if: always()
        run: |
          echo "=== STATE ==="
          if [ -f state.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("state.json")
          try:
              data = json.loads(p.read_text())
              agents = data.get("agents", [])
              print("Agents currently saved:", len(agents))
          except Exception as e:
              print("Could not read state.json:", e)
          PY
          else
            echo "No state.json yet"
          fi

      - name: Persist farm state
        if: always()
        run: |
          git config user.name "agent-evolution-bot"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Autonomous farm state update $(date -u +%Y-%m-%d-%H%M%S)"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              echo "Rebase failed."
              git rebase --abort || true
            fi

            sleep 10
          done

          echo "Could not push after 3 attempts."
          exit 1
